[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnt-benchmark"
version = "0.1.0"
description = "Individual-reward minefield evacuation against independently controlled tanks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "gymnasium>=1.0,<2", "pettingzoo>=1.24,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
visualization = ["pygame>=2.5,<3"]

[project.scripts]
mnt-demo = "mnt_env.demo:main"
mnt-watch = "mnt_env.visualization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
